# Docker Compose file for Unbound DNS with Redis cache backend - Nanopi R3S

services:
  unbound-db-socket:
    container_name: unbound-db-socket
    # init: true
    # tty: true
    image: busybox:latest
    volumes:
      - unbound-db-sock:/run/redis
      # - cachedb.d:/usr/local/unbound/cachedb.d/
      - ./cache/cachedb.d:/usr/local/unbound/cachedb.d/
    # command: /bin/sh -c "mkdir -p /run/redis && chown 999:1000 /run/redis && chmod 770 /run/redis && tail -f /dev/null"
    command: /bin/sh -c "mkdir -p /run/redis && chown 999:999 /run/redis && chmod 770 /run/redis && tail -f /dev/null"
    restart: unless-stopped

  unbound-db:
    container_name: unbound-db
    image: redis:alpine
    hostname: unbound-db
    depends_on:
      - unbound-db-socket
    volumes_from:
      - unbound-db-socket
    volumes:
      # - redis-data:/data
      - ./cache/redis:/data
      - ./data/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -s /run/redis/redis.sock ping | grep -q PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    # deploy: 
    #   resources:
    #     limits:
    #       cpus: '0.2'
    #       memory: 100M

  unbound:
    container_name: unbound
    image: madnuttah/unbound:latest
    depends_on:
      unbound-db:
        condition: service_healthy
    volumes_from:
      - unbound-db-socket
    volumes:
      - ./data/unbound/unbound.conf:/usr/local/unbound/unbound.conf:rw
      - ./data/unbound/conf.d:/usr/local/unbound/conf.d/:rw
      # - ./data/unbound/log.d/unbound.log:/usr/local/unbound/log.d/unbound.log:rw
      # - ./data/unbound/log.d/unbound-stats.log:/usr/local/unbound/log.d/unbound-stats.log:rw
      - ./data/unbound/log.d:/usr/local/unbound/log.d/:rw
      - ./data/unbound/log.d/unbound-stats.log:/usr/local/unbound/log.d/unbound-stats.log:rw
      # - ./data/unbound/iana.d:/usr/local/unbound/iana.d/:rw
      - ./data/unbound/zones.d:/usr/local/unbound/zones.d/:rw
      - ./data/unbound/healthcheck.sh:/usr/local/unbound/sbin/healthcheck.sh:rw # ro
      - ./data/unbound/root.hints:/usr/local/unbound/root.hints:ro
      - ./data/unbound/root.key:/usr/local/unbound/root.key:rw
      # - cachedb.d:/usr/local/unbound/cachedb.d/ # Para cache Redis persistente
      - ./cache/cachedb.d:/usr/local/unbound/cachedb.d/ # Para cache Redis persistente
      - ./data/unbound/control-keys:/usr/local/unbound/control-keys:ro
      - unbound-pid:/var/run  # Volume for PID file
    ports:
    #   # - "10.10.10.53:53:53/tcp"
    #   # - "10.10.10.53:53:53/udp"
      - "53:53/tcp"
      - "53:53/udp"
    #network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    environment:
      TZ: America/Sao_Paulo
      # Remove all user-related environment variables:
      # DISABLE_SET_PERMS: 1
      DISABLE_SET_PERMS: "true"
      UNBOUND_UID: 999
      UNBOUND_GID: 999
      HEALTHCHECK_PORT: 53
      EXTENDED_HEALTHCHECK: true
      ENABLE_STATS: true
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/unbound/sbin/healthcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    # deploy: 
    #   resources:
    #     limits:
    #       cpus: '0.8'
    #       memory: 150M

volumes:
  unbound-db-sock:
  # redis-data:
  # cachedb.d:
  unbound-pid:

# mkdir -pv data/unbound/{conf.d,iana.d,zones.d,log.d}
# mkdir -pv data/redis
