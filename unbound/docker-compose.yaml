services:
  unbound-db-socket:
    container_name: unbound-db-socket
    init: true
    tty: true
    image: busybox:latest
    volumes:
      - unbound-db-sock:/run/redis
      - cachedb.d:/usr/local/unbound/cachedb.d/
    # command: /bin/sh -c "mkdir -p /run/redis && chown 999:1000 /run/redis && chmod 770 /run/redis && sleep infinity"
    command: /bin/sh -c "mkdir -p /run/redis && chown 999:1000 /run/redis && chmod 770 /run/redis && tail -f /dev/null"
    restart: unless-stopped

  unbound-db:
    container_name: unbound-db
    image: redis:alpine
    hostname: unbound-db
    depends_on:
      - unbound-db-socket
    volumes_from:
      - unbound-db-socket
    volumes:
      - redis-data:/data
      - ./data/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    
  unbound:
    container_name: unbound
    image: madnuttah/unbound:latest
    depends_on:
      - unbound-db
    volumes_from:
      - unbound-db-socket
    volumes:
      - ./data/unbound/unbound.conf:/usr/local/unbound/unbound.conf:rw
      - ./data/unbound/conf.d:/usr/local/unbound/conf.d/:rw
      - ./data/unbound/log.d/unbound.log:/usr/local/unbound/log.d/unbound.log:rw
      - ./data/unbound/log.d/unbound-stats.log:/usr/local/unbound/log.d/unbound-stats.log:rw
      - ./data/unbound/zones.d:/usr/local/unbound/zones.d/:rw
      - ./data/unbound/healthcheck.sh:/usr/local/unbound/sbin/healthcheck.sh:ro
      - cachedb.d:/usr/local/unbound/cachedb.d/ # Para cache Redis persistente
      - unbound-pid:/var/run  # Volume for PID file
    ports:
      - "10.10.10.53:53:53/tcp"
      - "10.10.10.53:53:53/udp"
    cap_add:
      - NET_BIND_SERVICE
    environment:
      TZ: America/Sao_Paulo
      # Remove all user-related environment variables:
      # DISABLE_SET_PERMS: 1
      UNBOUND_UID: 1000
      UNBOUND_GID: 1000
      HEALTHCHECK_PORT: 53
      EXTENDED_HEALTHCHECK: true
      ENABLE_STATS: true
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/unbound/sbin/healthcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  unbound-db-sock:
  redis-data:
  cachedb.d:
  unbound-pid:

# mkdir -pv data/unbound/{conf.d,iana.d,zones.d,log.d}
# mkdir -pv data/redis