# Coleta de logs do Unbound para monitoring local
# Logs localizados em: /var/log/unbound-stats/

# Contagem de consultas por minuto
UserParameter=unbound.queries.count,cat /var/log/unbound-stats/unbound.log | grep -c "query"

# Contagem de respostas
UserParameter=unbound.replies.count,cat /var/log/unbound-stats/unbound.log | grep -c "reply"

# Contagem de falhas de serviço
UserParameter=unbound.servfail.count,cat /var/log/unbound-stats/unbound.log | grep -c "servfail"

# Contagem de erros
UserParameter=unbound.errors.count,cat /var/log/unbound-stats/unbound.log | grep -c "error"

# Contagem de warnings
UserParameter=unbound.warnings.count,cat /var/log/unbound-stats/unbound.log | grep -c "warning"

# Estatísticas do Unbound (cache hits, queries, etc.)
UserParameter=unbound.stats,unbound-control stats

# Cache hit rate
UserParameter=unbound.cache.hitrate,unbound-control stats | grep cache | head -1 | cut -d= -f2

# Total de queries
UserParameter=unbound.queries.total,unbound-control stats | grep "total.num.queries" | cut -d= -f2

# Tempo médio de resposta
UserParameter=unbound.response.time,unbound-control stats | grep "total.avg" | cut -d= -f2

