server:
    # interface: 0.0.0.0@5335
    # interface: ::1@53
    interface: 0.0.0.0@53
    # interface: 127.0.0.1@53
    # interface: ::0@5335

    outgoing-interface: 0.0.0.0

    do-ip4: yes
    do-ip6: no      # Desativar IPv6 (economiza memória)
    do-tcp: no
    do-udp: yes     # Desativar TCP
    udp-connect: yes

    prefer-ip4: yes
    prefer-ip6: no