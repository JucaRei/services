server:
    #################################################################
    # THREADS / CONCURRENCY
    #################################################################
    num-threads: 1
    so-reuseport: yes
    outgoing-range: 128            # Reduzir conexões
    num-queries-per-thread: 256

    #################################################################
    # CACHE EM RAM — DESATIVADO (USO DO REDIS)
    #################################################################
    msg-cache-size: 0
    rrset-cache-size: 0
    neg-cache-size: 0

    #################################################################
    # SLABS (SEM CACHE RAM → 1 É O IDEAL)
    #################################################################
    msg-cache-slabs: 1
    rrset-cache-slabs: 1
    infra-cache-slabs: 1
    key-cache-slabs: 1

    #################################################################
    # TTL / PREFETCH
    #################################################################
    cache-min-ttl: 600             # 10min (equilibrado)
    cache-max-ttl: 7200            # 2h (não muito alto)
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes              # Reduz consultas

    #################################################################
    # BUFFERS / UDP / EDNS
    #################################################################
    edns-buffer-size: 1232
    max-udp-size: 4096
    msg-buffer-size: 8192
