server:
    #################################################################
    # THREADS / CONCURRENCY
    #################################################################
    num-threads: 1
    so-reuseport: yes
    outgoing-range: 128            # Reduzir conexões
    num-queries-per-thread: 256

    #################################################################
    # CACHE EM RAM — DESATIVADO (USO DO REDIS)
    #################################################################
    # msg-cache-size: 0
    # rrset-cache-size: 0
    # neg-cache-size: 0

    # CACHE EM RAM — HABILITADO (FALBACK)
    msg-cache-size: 16m
    rrset-cache-size: 32m
    neg-cache-size: 8m

    #################################################################
    # SLABS (SEM CACHE RAM → 1 É O IDEAL)
    #################################################################
    msg-cache-slabs: 1
    rrset-cache-slabs: 1
    infra-cache-slabs: 1
    key-cache-slabs: 1

    #################################################################
    # TTL / PREFETCH
    #################################################################
    cache-min-ttl: 300             # 5 min minimum – balances freshness & hits
    cache-max-ttl: 86400           # 24h (não muito alto)
    serve-expired: yes             # Reduz consultas
    serve-expired-ttl: 86400       # Allow serving stale up to 24h
    serve-expired-reply-ttl: 30    # Advertise short TTL on stale answers
    prefetch: yes                  # Proactively refresh popular records
    prefetch-key: yes              # Also prefetch DNSKEYs for DNSSEC

    #################################################################
    # BUFFERS / UDP / EDNS
    #################################################################
    edns-buffer-size: 1232
    max-udp-size: 4096
    msg-buffer-size: 8192

    verbosity: 2   # Already set — good for seeing cachedb init