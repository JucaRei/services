server:	
    num-threads: 2
    msg-cache-slabs: 2
    rrset-cache-slabs: 2
    infra-cache-slabs: 2
    key-cache-slabs: 2
    msg-cache-size: 64m
    rrset-cache-size: 128m
    cache-min-ttl: 300
    cache-max-ttl: 86400
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    neg-cache-size: 4M
    outgoing-range: 512
    num-queries-per-thread: 1024
    edns-buffer-size: 1232
    max-udp-size: 4096
    msg-buffer-size: 8192
    so-reuseport: yes