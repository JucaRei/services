server:
    #################################################################
    # THREADS / CONCURRENCY
    #################################################################
    num-threads: 2
    so-reuseport: yes
    outgoing-range: 512
    num-queries-per-thread: 1024

    #################################################################
    # CACHE EM RAM — DESATIVADO (USO DO REDIS)
    #################################################################
    msg-cache-size: 0
    rrset-cache-size: 0
    neg-cache-size: 0

    #################################################################
    # SLABS (SEM CACHE RAM → 1 É O IDEAL)
    #################################################################
    msg-cache-slabs: 1
    rrset-cache-slabs: 1
    infra-cache-slabs: 1
    key-cache-slabs: 1

    #################################################################
    # TTL / PREFETCH
    #################################################################
    cache-min-ttl: 300
    cache-max-ttl: 86400
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes

    #################################################################
    # BUFFERS / UDP / EDNS
    #################################################################
    edns-buffer-size: 1232
    max-udp-size: 4096
    msg-buffer-size: 8192
