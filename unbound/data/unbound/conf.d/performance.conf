server:	
    num-threads: 1
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4
    msg-cache-size: 128m
    rrset-cache-size: 256m
    cache-min-ttl: 300
    cache-max-ttl: 86400
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    neg-cache-size: 4M
    outgoing-range: 8192
    num-queries-per-thread: 4096
    edns-buffer-size: 1232
    max-udp-size: 4096
    msg-buffer-size: 65552