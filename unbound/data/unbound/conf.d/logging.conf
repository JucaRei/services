server:	
  use-syslog: no
  log-time-ascii: yes
  # logfile: "/usr/local/unbound/log.d/unbound.log"
  logfile: "/dev/null"  # This will discard all logs
  log-local-actions: no
  log-queries: no
  log-replies: no
  # log-servfail: yes
  log-servfail: no
  # val-log-level: 2
  val-log-level: 0
  # verbosity: 1
  verbosity: 0