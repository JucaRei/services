server:	
  use-syslog: no
  log-time-ascii: yes
  logfile: "/usr/local/unbound/log.d/unbound.log"   # ✅ Logar ações locais
  # logfile: "/dev/null"  # This will discard all logs
  log-local-actions: yes   # ✅ Logar ações locais
  log-queries: yes         # ✅ Logar consultas (importante para estatísticas)
  log-replies: yes         # ✅ Logar respostas
  log-servfail: yes        # ✅ Logar falhas
  val-log-level: 1         # ✅ Logging DNSSEC básico
  # verbosity: 1             # ✅ Logging detalhado
  verbosity: 2             # ✅ Logging detalhado