# ==============================================================================
# CONFIGURAÇÃO DE LOGS DO UNBOUND
# Otimizado para evitar gargalos de I/O em cartões SD/eMMC e erros no LXC
# ==============================================================================

server:
  # Desativa o uso do syslog do sistema operacional do container (mantém isolado).
  use-syslog: no
  
  # Formato de data legível (ASCII) em vez de timestamps brutos (epoch).
  log-time-ascii: yes
  
  # ⚠️ EVITE ERROS DE PERMISSÃO: Deixar o caminho vazio ("") força o Unbound a enviar
  # todos os logs para o stdout/stderr (saída padrão do Docker). 
  # Isso evita falhas de escrita (Permission Denied) causadas pelo LXC Unprivileged 
  # e permite monitorar o serviço rodando 'docker logs unbound'.
  logfile: ""
  
  # Não loga ações de redirecionamento locais (evita logs desnecessários).
  log-local-actions: no
  
  # DESATIVADO POR PERFORMANCE: Logar todas as consultas (queries) e respostas (replies)
  # causa um volume absurdo de escritas em disco. Em NanoPi (que usa SD Card), isso
  # gera lentidão e reduz a vida útil do cartão. Deixe em 'no' em produção.
  log-queries: no
  log-replies: no
  
  # Loga apenas falhas graves de resolução (SERVFAIL). Muito útil para depuração.
  log-servfail: yes
  
  # Nível de log de validação DNSSEC. 0 = Desativado (apenas erros graves).
  val-log-level: 0
  
  # Nível de verbosidade geral. 
  # 0 = apenas erros graves. 
  # 1 = log básico de inicialização.
  # 2 = detalha estatísticas e o carregamento do cachedb/Redis.
  verbosity: 0
