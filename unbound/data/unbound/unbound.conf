# ==============================================================================
# CONFIGURAÇÃO PRINCIPAL DO UNBOUND
# Otimizado para NanoPi R3S (Debian/OpenWRT) rodando em Docker/LXC Unprivileged
# ==============================================================================

server:
    # --- Diretórios e Execução ---
    # Diretório interno de trabalho do Unbound no container.
    directory: "/usr/local/unbound"
    
    # Chroot deve ser desativado para permitir que o Unbound acesse caminhos 
    # externos montados no container (como chaves e logs).
    chroot: ""
    
    # do-daemonize deve ser 'no' para que o processo permaneça em primeiro plano,
    # permitindo que o Docker monitore o status do container corretamente.
    do-daemonize: no
    
    # Definido como /dev/null para evitar que o Unbound tente gerenciar um arquivo de PID.
    # Em containers, quem gerencia o ciclo de vida do processo é o próprio Docker.
    pidfile: "/dev/null"
    
    # Username vazio indica ao Unbound para rodar com o UID/GID que já foi atribuído
    # externamente (gerenciado pelas variáveis UNBOUND_UID/GID no docker-compose.yaml).
    username: ""

    # --- Configuração de Módulos ---
    # ORDEM CRÍTICA: O módulo cachedb DEVE vir entre validator (DNSSEC) e iterator.
    # - validator: valida assinaturas criptográficas dos domínios.
    # - cachedb: intercepta consultas e lê/grava no Redis para cache super rápido.
    # - iterator: faz a consulta recursiva aos root servers se o registro não estiver em cache.
    module-config: "validator cachedb iterator"

# --- Importações Modulares (Include) ---
# Importa arquivos externos para manter o arquivo principal limpo e legível.
# ATENÇÃO: As chaves definidas no arquivo principal não foram duplicadas nas subpastas
# para evitar conflitos de sintaxe (como duplicar declarações de interface ou verbosidade).
include-toplevel: "/usr/local/unbound/conf.d/*.conf"
include-toplevel: "/usr/local/unbound/zones.d/*.conf"

# --- Configuração do Cache persistente com Redis ---
cachedb:
    backend: "redis"
    # Comunicação via UNIX socket para evitar o overhead de rede TCP.
    # O socket (/run/redis/redis.sock) é compartilhado através do container unbound-db-socket.
    redis-server-path: "/run/redis/redis.sock"
    
    # Timeout de 50ms para conexão com o Redis (baixo pois a comunicação via socket é local).
    redis-timeout: 50
    
    # Delega ao Redis o controle de expiração dos registros em cache baseados no TTL.
    redis-expire-records: yes

# --- Controle Remoto (unbound-control) ---
remote-control:
    # ⚠️ IMPORTANTE: Mantido em 'no' por padrão. Se ativado como 'yes' sem que os arquivos
    # de chaves SSL (abaixo) existam fisicamente no host, o Unbound falhará no boot.
    # Para usar o controle (e atualizar estatísticas via healthcheck):
    # 1. Deixe em 'no', inicie o container.
    # 2. Rode no host: 'sudo unbound-control-setup' na pasta de chaves do host.
    # 3. Altere este parâmetro para 'yes' e reinicie o container.
    control-enable: no
    control-interface: 127.0.0.1
    control-port: 8953
    server-key-file: "/usr/local/unbound/control-keys/unbound_server.key"
    server-cert-file: "/usr/local/unbound/control-keys/unbound_server.pem"
    control-key-file: "/usr/local/unbound/control-keys/unbound_control.key"
    control-cert-file: "/usr/local/unbound/control-keys/unbound_control.pem"
