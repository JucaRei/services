port 6379

daemonize no
supervised no
pidfile /data/redis.pid
loglevel notice
logfile ""
databases 1

# Reduzir para 64MB
maxmemory 64mb
# Política eficiente
maxmemory-policy allkeys-lru
# Desativar snapshots (SSD)
save ""
# Aumentar intervalo
tcp-keepalive 60
# Não acumular
timeout 300


dir /data
dbfilename dump.rdb
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Desativar recursos pesados:
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no

# Otimizações para baixa memória:
hash-max-ziplist-entries 256
hash-max-ziplist-value 32
list-max-ziplist-size -2
set-max-intset-entries 256
zset-max-ziplist-entries 64
zset-max-ziplist-value 32

# Correção de permissões
user default on nopass ~* &* +@all
dir /data
logfile /data/redis.log