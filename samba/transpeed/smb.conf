[global]
    workgroup = WORKGROUP
    server string = Transpeed Samba
    security = user
    map to guest = Bad User
    guest account = nobody

[Transpeed]
    path = /storage
    browseable = yes
    writable = yes
    guest ok = yes
    guest only = yes
    force user = root
    create mask = 0664
    directory mask = 0775