services:
  pyload:
    image: linuxserver/pyload-ng:latest
    container_name: pyload
    restart: unless-stopped
    ports:
      - "5000:8000"
      - "5001:9666"
    environment:
      - TZ=America/Sao_Paulo
      - UMASK=022
      - PUID=1000
      - PGID=1000
    volumes:
      - pyload_config:/config
      - /mnt/orico/Downloads:/downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pyload_network

volumes:
  pyload_config:
    driver: local
  # pyload_downloads:
  #   driver: local

networks:
  pyload_network:
    driver: bridge
