services:
  technitium:
    # Imagem fixa (evita mudanças inesperadas em updates)
    # image: technitium/dns-server:15.4.0
    image: technitium/dns-server:15.6.1

    # Nome do container (facilita debug/logs)
    container_name: dns01

    # Hostname interno (usado em cluster/logs)
    hostname: dns01

    # Reinicia automaticamente se cair
    restart: unless-stopped

    # networks:
    #   proxy:
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.technitium.entrypoints=http"
    #   - "traefik.http.routers.technitium.rule=Host(`technitium.MYDOMAIN.com.br`)"
    #   - "traefik.http.middlewares.technitium-https-redirect.redirectscheme.scheme=https"
    #   - "traefik.http.routers.technitium.middlewares=technitium-https-redirect"
    #   - "traefik.http.routers.technitium-secure.entrypoints=https"
    #   - "traefik.http.routers.technitium-secure.rule=Host(`technitium.MYDOMAIN.com.br`)"
    #   - "traefik.http.routers.technitium-secure.tls=true"
    #   - "traefik.http.routers.technitium-secure.service=technitium"
    #   - "traefik.http.services.technitium.loadbalancer.server.port=5380"
    #   - "traefik.docker.network=proxy"

    # DNS usado pelo próprio container (não afeta o serviço DNS que ele fornece)
    dns:
      - 10.10.10.53  # Unbound externo

    # Remove search domains para evitar resoluções inesperadas
    dns_search: []

    # Opções do resolver interno do container
    dns_opt:
      - use-vc   # força uso de TCP (evita truncation)
      - ndots:0  # evita tentativas com sufixos
      - edns0    # ativa extensões modernas de DNS

    ports:
      # Expõe DNS no IP específico do host (evita conflitos)
      - "10.10.10.25:53:53/udp" # DNS service
      - "10.10.10.25:53:53/tcp" # DNS service

      - "5380:5380/tcp" # Interface web HTTP (HTTP)

      - "53443:53443/tcp" # Interface web HTTPS (Web console HTTPS)

      - "853:853/tcp" #DNS-over-TLS service

      - "853:853/udp" #DNS-over-QUIC service

      - "443:443/udp" #DNS-over-HTTPS (HTTP/3)

      # - "443:443/tcp" #DNS-over-HTTPS service (HTTP/1.1, HTTP/2)

      # - "80:80/tcp" #DNS-over-HTTP service (use with reverse proxy or certbot certificate renewal)

      # - "8053:8053/tcp" #DNS-over-HTTPS service (use with reverse proxy)

      # - "67:67/udp" #DHCP service

    environment:
      # Nome lógico do servidor (usado internamente / cluster para se identificar)
      DNS_SERVER_DOMAIN: dns01

      # Escuta em todos os IPs (necessário em container)
      DNS_SERVER_LISTEN_ADDRESSES: "0.0.0.0,::"

      # Forwarder principal (Unbound)
      DNS_SERVER_FORWARDERS: "10.10.10.53"

      # Protocolos usados para encaminhar queries
      DNS_SERVER_FORWARDER_PROTOCOL: "Udp,Tcp"

      # Modo de recursão:
      # Allow = recursivo próprio
      # UseForwarders = usa somente o Unbound (recomendado)
      # DNS_SERVER_RECURSION: Allow
      DNS_SERVER_RECURSION: "UseForwarders"

      # Prefere IPv4 (evita delays se IPv6 não estiver bem configurado)
      DNS_SERVER_PREFER_IPV4: "true"

      # Timeout para resposta do forwarder (ms)
      DNS_SERVER_FORWARDER_TIMEOUT: "2000"

      # Número de tentativas antes de falhar
      DNS_SERVER_FORWARDER_RETRIES: "2"

      # Log de queries (desativado = melhor performance)
      DNS_SERVER_LOG_QUERIES: "false"

      # Senha do painel admin (ideal mover para .env em produção)
      DNS_SERVER_ADMIN_PASSWORD: "${DNS_ADMIN_PASSWORD}"

      # TTL máximo de cache (segundos)
      DNS_SERVER_CACHE_MAX_TTL: "300"

      # TTL mínimo de cache (segundos)
      DNS_SERVER_CACHE_MIN_TTL: "180"

      # Redes permitidas a usar recursão (segurança)
      DNS_SERVER_RECURSION_NETWORK_ACL: "10.0.0.0/8,192.168.0.0/16"

      # Mantém estatísticas na RAM, poupando a vida útil do cartão SD/eMMC:
  DNS_SERVER_STATS_ENABLE_IN_MEMORY_STATS: "true"

      # DNS_SERVER_ENABLE_BLOCKING: "true"
      # DNS_SERVER_OPTIONAL_PROTOCOL_DNS_OVER_HTTP: "true"
      # DNS-SERVER_LOG_FOLDER_PATH: "/var/log/technitium/dns"

      # - DNS_SERVER_ADMIN_PASSWORD_FILE=password.txt #The path to a file that contains a plain text password for the DNS web console admin user.
      # - DNS_SERVER_PREFER_IPV6=false #DNS Server will use IPv6 for querying whenever possible with this option enabled.
      # - DNS_SERVER_WEB_SERVICE_LOCAL_ADDRESSES=172.17.0.1,127.0.0.1 #Comma separated list of network interface IP addresses that you want the web service to listen on for requests. The "172.17.0.1" address is the built-in Docker bridge. The "[::]" is the default value if not specified. Note! This must be used only with "host" network mode.
      # - DNS_SERVER_WEB_SERVICE_HTTP_PORT=5380 #The TCP port number for the DNS web console over HTTP protocol.
      # - DNS_SERVER_WEB_SERVICE_HTTPS_PORT=53443 #The TCP port number for the DNS web console over HTTPS protocol.
      # - DNS_SERVER_WEB_SERVICE_ENABLE_HTTPS=false #Enables HTTPS for the DNS web console.
      # - DNS_SERVER_WEB_SERVICE_USE_SELF_SIGNED_CERT=false #Enables self signed TLS certificate for the DNS web console.
      # - DNS_SERVER_WEB_SERVICE_TLS_CERTIFICATE_PATH=/etc/dns/tls/cert.pfx #The file path to the TLS certificate for the DNS web console.
      # - DNS_SERVER_WEB_SERVICE_TLS_CERTIFICATE_PASSWORD=password #The password for the TLS certificate for the DNS web console.
      # - DNS_SERVER_WEB_SERVICE_HTTP_TO_TLS_REDIRECT=false #Enables HTTP to HTTPS redirection for the DNS web console.
      # - DNS_SERVER_OPTIONAL_PROTOCOL_DNS_OVER_HTTP=false #Enables DNS server optional protocol DNS-over-HTTP on TCP port 8053 to be used with a TLS terminating reverse proxy like nginx.
      # - DNS_SERVER_RECURSION=AllowOnlyForPrivateNetworks #Recursion options: Allow, Deny, AllowOnlyForPrivateNetworks, UseSpecifiedNetworkACL.
      # - DNS_SERVER_RECURSION_NETWORK_ACL=192.168.10.0/24, !192.168.10.2 #Comma separated list of IP addresses or network addresses to allow access. Add ! character at the start to deny access, e.g. !192.168.10.0/24 will deny entire subnet. The ACL is processed in the same order its listed. If no networks match, the default policy is to deny all except loopback. Valid only for `UseSpecifiedNetworkACL` recursion option.
      # - DNS_SERVER_RECURSION_DENIED_NETWORKS=1.1.1.0/24 #Comma separated list of IP addresses or network addresses to deny recursion. Valid only for `UseSpecifiedNetworkACL` recursion option. This option is obsolete and DNS_SERVER_RECURSION_NETWORK_ACL should be used instead.
      # - DNS_SERVER_RECURSION_ALLOWED_NETWORKS=127.0.0.1, 192.168.1.0/24 #Comma separated list of IP addresses or network addresses to allow recursion. Valid only for `UseSpecifiedNetworkACL` recursion option.  This option is obsolete and DNS_SERVER_RECURSION_NETWORK_ACL should be used instead.
      # - DNS_SERVER_ENABLE_BLOCKING=false #Sets the DNS server to block domain names using Blocked Zone and Block List Zone.
      # - DNS_SERVER_ALLOW_TXT_BLOCKING_REPORT=false #Specifies if the DNS Server should respond with TXT records containing a blocked domain report for TXT type requests.
      # - DNS_SERVER_BLOCK_LIST_URLS= #A comma separated list of block list URLs.
      # - DNS_SERVER_FORWARDERS=1.1.1.1, 8.8.8.8 #Comma separated list of forwarder addresses.
      # - DNS_SERVER_FORWARDER_PROTOCOL=Tcp #Forwarder protocol options: Udp, Tcp, Tls, Https, HttpsJson.
      # - DNS_SERVER_LOG_USING_LOCAL_TIME=true #Enable this option to use local time instead of UTC for logging.
      # - DNS_SERVER_LOG_MAX_LOG_FILE_DAYS=365 #Max number of days to keep the log files. Log files older than the specified number of days will be deleted automatically. Set 0 to disable auto delete.
      # - DNS_SERVER_STATS_ENABLE_IN_MEMORY_STATS=false #This option will enable in-memory stats and only Last Hour data will be available on Dashboard. No stats data will be stored on disk.
      # - DNS_SERVER_STATS_MAX_STAT_FILE_DAYS=365 #Max number of days to keep the dashboard stats. Stat files older than the specified number of days will be deleted automatically. Set 0 to disable auto delete.

    volumes:
      - technitium-config:/etc/dns # Persistência da configuração e dados
      # - logs:/var/log/technitium/dns # Persistência dos logs

    extra_hosts:
      # Resolve o segundo node do cluster sem depender do DNS
      - "dns02.cloud.local:10.10.10.26"

    healthcheck:
      # Testa resolução real do DNS interno
      # test: ["CMD", "dig", "@127.0.0.1", "go.technitium.com", "+short"]
      test: ["CMD", "dig", "@127.0.0.1", "google.com", "+short"]

      # Intervalo entre checks
      interval: 30s

      # Tempo máximo de resposta
      timeout: 5s

      # Número de falhas antes de marcar como unhealthy
      retries: 3

    sysctls:
      - net.ipv4.ip_local_port_range=1024 65535 # remove when using "host" network mode


volumes:
  technitium-config:
    # Nome do volume persistente
    name: technitium-dns01-config
  # logs:
  #   name: technitium-dns01-logs

