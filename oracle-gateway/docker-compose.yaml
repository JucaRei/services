# ==============================================================================
# Oracle Cloud Gateway: Rathole Server + Nginx + Certbot + WireGuard + CrowdSec
# Homelab Services: Entrada Pública Segura via OCI Always Free
# ==============================================================================

services:
  # Servidor de Túnel Reverso (Rathole)
  rathole-server:
    image: localhost/rathole:local
    build:
      context: .
      dockerfile: Containerfile.rathole
    container_name: rathole-server
    restart: unless-stopped
    command: ["--server", "/app/server.toml"]
    volumes:
      - ./server.toml:/app/server.toml:ro
    ports:
      - "2333:2333" # Porta pública de controle (comunicação com NanoPi R3S)
    networks:
      - gateway-net
    deploy:
      resources:
        limits:
          memory: 32M

  # Proxy Reverso Nginx com Terminação SSL
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"   # HTTP (Redirecionamento 301 e desafio ACME)
      - "443:443" # HTTPS (SSL seguro Let's Encrypt)
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/logs:/var/log/nginx
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - gateway-net
    depends_on:
      - rathole-server
    deploy:
      resources:
        limits:
          memory: 64M

  # Renovador Automático de Certificados SSL Let's Encrypt (DNS-01 DuckDNS)
  certbot:
    image: localhost/certbot-duckdns:local
    build:
      context: .
      dockerfile: Containerfile.certbot
    container_name: certbot-renew
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./certbot/duckdns.ini:/etc/letsencrypt/duckdns.ini:ro
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - gateway-net

  # Sistema de Detecção e Prevenção de Intrusão (CrowdSec)
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      - COLLECTIONS=crowdsecurity/nginx crowdsecurity/http-cve crowdsecurity/whitelist-good-actors
    ports:
      - "127.0.0.1:8080:8080" # Local API (LAPI) acessível apenas pelo bouncer do host
    volumes:
      - ./crowdsec/config:/etc/crowdsec
      - ./crowdsec/data:/var/lib/crowdsec/data
      - ./nginx/logs:/var/log/nginx:ro
    networks:
      - gateway-net
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  gateway-net:
    driver: bridge
