# ==============================================================================
# Oracle Cloud Gateway: Rathole Server + Nginx + Certbot + WireGuard + CrowdSec
# Homelab Services: Entrada Pública Segura via OCI Always Free
# ==============================================================================

services:
  # Servidor de Túnel Reverso (Rathole)
  rathole-server:
    image: rapiz1/rathole:latest
    container_name: rathole-server
    restart: unless-stopped
    command: ["--server", "/app/server.toml"]
    volumes:
      - ./server.toml:/app/server.toml:ro
    ports:
      - "2333:2333" # Porta pública de controle (comunicação com NanoPi R3S)
    networks:
      - gateway-net
    deploy:
      resources:
        limits:
          memory: 32M

  # Proxy Reverso Nginx com Terminação SSL
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"   # HTTP (Redirecionamento 301 e desafio ACME)
      - "443:443" # HTTPS (SSL seguro Let's Encrypt)
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/logs:/var/log/nginx
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - gateway-net
    depends_on:
      - rathole-server
    deploy:
      resources:
        limits:
          memory: 64M

  # Renovador Automático de Certificados SSL Let's Encrypt
  certbot:
    image: certbot/certbot:latest
    container_name: certbot-renew
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - gateway-net

  # Servidor VPN WireGuard com Painel Web (wg-easy)
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg-easy
    restart: unless-stopped
    environment:
      - WG_HOST=jucalab.duckdns.org
      - WG_PORT=51820
      - WG_DEFAULT_ADDRESS=10.66.66.x
      - WG_DEFAULT_DNS=1.1.1.1
      - WG_ALLOWED_IPS=0.0.0.0/0
      - PASSWORD_HASH=${WG_PASSWORD_HASH}
    volumes:
      - ./wireguard:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "127.0.0.1:51821:51821/tcp" # Painel restrito ao localhost / túnel SSH
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - gateway-net
    deploy:
      resources:
        limits:
          memory: 64M

  # Sistema de Detecção e Prevenção de Intrusão (CrowdSec)
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      - COLLECTIONS=crowdsecurity/nginx crowdsecurity/http-cve crowdsecurity/whitelist-good-actors
    volumes:
      - ./crowdsec/config:/etc/crowdsec
      - ./crowdsec/data:/var/lib/crowdsec/data
      - ./nginx/logs:/var/log/nginx:ro
    networks:
      - gateway-net
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  gateway-net:
    driver: bridge
