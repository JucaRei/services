# ==============================================================================
# Oracle Cloud Gateway: Rathole Server + Nginx Reverse Proxy + Certbot SSL
# Homelab Services: Entrada Pública Segura via OCI Always Free
# ==============================================================================

services:
  # Servidor de Túnel Reverso (Rathole)
  rathole-server:
    image: rapiz1/rathole:latest
    container_name: rathole-server
    restart: unless-stopped
    command: ["--server", "/app/server.toml"]
    volumes:
      - ./server.toml:/app/server.toml:ro
    ports:
      - "2333:2333" # Porta pública de controle (comunicação com NanoPi R3S)
    networks:
      - gateway-net
    deploy:
      resources:
        limits:
          memory: 32M

  # Proxy Reverso Nginx com Terminação SSL
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"   # HTTP (Redirecionamento 301 e desafio ACME)
      - "443:443" # HTTPS (SSL seguro Let's Encrypt)
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - gateway-net
    depends_on:
      - rathole-server
    deploy:
      resources:
        limits:
          memory: 64M

  # Renovador Automático de Certificados SSL Let's Encrypt
  certbot:
    image: certbot/certbot:latest
    container_name: certbot-renew
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge

