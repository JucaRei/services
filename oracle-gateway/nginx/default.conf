# ==============================================================================
# Nginx Reverse Proxy - Configuração de Entrada (jucalab.duckdns.org)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. BLOCO HTTP (Porta 80): Redirecionamento 301 + Desafio ACME Let's Encrypt
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name jucalab.duckdns.org;

    # Pasta compartilhada com o Certbot para renovação automática via webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona todo o tráfego restante para HTTPS seguro
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. BLOCO HTTPS (Porta 443): Terminação TLS + Proxy para o Rathole Server
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jucalab.duckdns.org;

    # Certificados gerenciados pelo Certbot
    ssl_certificate /etc/letsencrypt/live/jucalab.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jucalab.duckdns.org/privkey.pem;

    # Parâmetros de segurança TLS moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";

    # Cabeçalhos de proteção HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Encaminhamento para o serviço Jellyfin no Rathole
    location / {
        # O Nginx alcança o Rathole diretamente pelo nome do container na rede Docker interna:
        proxy_pass http://rathole-server:8096;

        # Repasse de cabeçalhos reais do cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a WebSockets (obrigatório para sync e player do Jellyfin)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer otimizado para streaming
        proxy_buffering off;
    }
}

