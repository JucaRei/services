# ==============================================================================
# Nginx Reverse Proxy - Configuração de Entrada Wildcard (*.jucalab.duckdns.org)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. BLOCO HTTP (Porta 80): Redirecionamento 301 Universal para HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Pasta compartilhada para desafios ACME HTTP-01 legados (se necessário)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona todo o tráfego restante para HTTPS seguro
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. BLOCO HTTPS FALLBACK (Porta 443): Descarta conexões não mapeadas / scanners
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # Certificados SSL Let's Encrypt Wildcard
    ssl_certificate /etc/letsencrypt/live/jucalab.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jucalab.duckdns.org/privkey.pem;

    # Fecha a conexão TCP imediatamente sem enviar nenhum byte de resposta HTTP
    return 444;
}

# ------------------------------------------------------------------------------
# 3. BLOCO HTTPS: Jellyfin Media Server (jellyfin.jucalab.duckdns.org)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jellyfin.jucalab.duckdns.org jucalab.duckdns.org;

    # Certificados SSL gerenciados pelo Certbot (Wildcard cobre ambos)
    ssl_certificate /etc/letsencrypt/live/jucalab.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jucalab.duckdns.org/privkey.pem;

    # Parâmetros de segurança TLS moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";

    # Cabeçalhos de proteção HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Encaminhamento para o serviço Jellyfin no Rathole
    location / {
        proxy_pass http://rathole-server:8096;

        # Repasse de cabeçalhos reais do cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a WebSockets (obrigatório para sync e player do Jellyfin)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer otimizado para streaming contínuo de mídia
        proxy_buffering off;
    }
}

# ------------------------------------------------------------------------------
# 4. BLOCO HTTPS: Transmission Web UI (transmission.jucalab.duckdns.org)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name transmission.jucalab.duckdns.org;

    # Certificados SSL gerenciados pelo Certbot (Wildcard)
    ssl_certificate /etc/letsencrypt/live/jucalab.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jucalab.duckdns.org/privkey.pem;

    # Parâmetros de segurança TLS moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";

    # Cabeçalhos de proteção HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Encaminhamento para o serviço Transmission no Rathole
    location / {
        proxy_pass http://rathole-server:9091;

        # Repasse de cabeçalhos reais do cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
