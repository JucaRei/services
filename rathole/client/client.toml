[client]
# Endereço da VPS Oracle (porta de controle do Rathole)
remote_addr = "jucalab.duckdns.org:2333"

# Token compartilhado entre o cliente e o servidor (para autenticação mútua)
default_token = "TOKEN_SECRETO_AQUI"

# -------------------------------------------------------------
# Exemplo 1: Serviço Web / Painel (ex: Jellyfin, Proxmox, etc.)
# -------------------------------------------------------------
[client.services.meu_servico]
type = "tcp"
local_addr = "10.10.10.135:8096" # IP e porta do serviço dentro da sua casa

