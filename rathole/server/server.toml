[server]
# Porta de controle onde o cliente (NanoPi) vai conectar
bind_addr = "0.0.0.0:2333"

# Chave secreta (DEVE ser idêntica à colocada no client.toml)
default_token = "TOKEN_SECRETO_AQUI"

# -------------------------------------------------------------
# Exemplo 1: Serviço Web (nome precisa bater com o client.toml)
# -------------------------------------------------------------
[server.services.meu_servico]
type = "tcp"
# 0.0.0.0:8096 expõe a porta diretamente para a internet
# (ou use 127.0.0.1:8096 se for colocar o Caddy/Nginx na frente com SSL)
bind_addr = "0.0.0.0:8096"

