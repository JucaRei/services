[server]
# Porta de controle onde o cliente (NanoPi) vai conectar
bind_addr = "0.0.0.0:2333"

# Chave secreta (DEVE ser idêntica à colocada no client.toml)
default_token = "4d6fd6c76534705780481ea75f85af29"

# -------------------------------------------------------------
# Exemplo 1: Serviço Web (Jellyfin)
# -------------------------------------------------------------
[server.services.jellyfin]
type = "tcp"
# 127.0.0.1:8096 escuta localmente para o Nginx receber via HTTPS
bind_addr = "127.0.0.1:8096"

