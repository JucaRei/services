services:
  transmission:
    image: linuxserver/transmission:4.1.1 #4.0.5
    #image: linuxserver/transmission:version-3.00-r8
    container_name: transmission
    # network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - USER=juca
      - PASS=200291
      # - TRANSMISSION_WEB_HOME= #optional
      # - WHITELIST= #optional
      # - PEERPORT= #optional
      # - HOST_WHITELIST= #optional
      # - WEBUI_PORT=9091
    volumes:
      - ./data:/config

      ### Orico samba from soyoz
      - /mnt/orico/Animes:/animes3
      - /mnt/orico/Filmes:/filmes3
      - /mnt/orico/Seriados:/series3
      - /mnt/orico/Downloads:/downloads3

      ### HD 500gb
      - /mnt/500gb/Media/Animes:/animes4
      - /mnt/500gb/Media/Movies:/filmes4
      - /mnt/500gb/Media/TvShows:/series4
      - /mnt/500gb/Downloads:/downloads4
      - /mnt/500gb/Cursos:/cursos4

      ### HD 700gb
      - /mnt/700gb/Animes:/animes
      - /mnt/700gb/Downloads:/downloads
      - /mnt/700gb/Tvshows:/series
      - /mnt/700gb/Movies:/filmes
      - /mnt/700gb/Books:/livros
      - /mnt/700gb/Mangas:/mangas
      - /mnt/700gb/Cursos:/cursos

      ### HD 400gb
      - /mnt/hd400g/Movies:/filmes1
      - /mnt/hd400g/TvShows:/series1
      - /mnt/hd400g/Animes:/animes1
      - /mnt/hd400g/Read/Mangas:/mangas1
      - /mnt/hd400g/Read/Books:/books1
      - /mnt/hd400g/Read/Comics:/comics1

      ### HD 2TB
      - /mnt/hd2tb/Filmes:/filmes2
      - /mnt/hd2tb/Series:/series2
      - /mnt/hd2tb/Animes:/animes2
      - /mnt/hd2tb/Downloads:/downloads2
      - /mnt/hd2tb/Cursos:/cursos2
      - /mnt/hd2tb/Documentarios:/documentarios

      ### HD 700gb
      # - animes:/animes
      # - downloads:/downloads
      # - series:/series
      # - movies:/filmes
      # - books:/livros
      # - mangas:/mangas
      # - cursos:/cursos

      ### HD 400gb
      # - nas1_movies:/filmes1
      # - nas1_tvshow:/series1
      # - nas1_animes:/animes1
      # - mangas1:/mangas1
      # - books1:/books1
      # - comics1:/comics1

      ### HD 2TB
      # - nas2_movies:/filmes2
      # - nas2_tvshow:/series2
      # - nas2_animes:/animes2
      # - nas2_downloads:/downloads2
      # - nas2_cursos:/cursos2
      # - nas2_documentarios:/documentarios
    ports:
      - 7777:9091
      - 51413:51413
      - 51413:51413/udp
      # - 51820:51820/udp # wireguard
    # mem_limit: 160M
    # mem_reservation: 50M
    # cpus: 1.5
    restart: unless-stopped
