# ==============================================================================
# CrowdSec - Configuração de Aquisição de Logs (acquis.yaml)
# ==============================================================================

# 1. Logs de acesso do Caddy (Formato JSON)
filenames:
  - /var/log/caddy/*.log
labels:
  type: caddy

---
# 2. Logs do Sistema e SSH do Host (LXC harden - Alpine Linux)
filenames:
  - /var/log/messages
labels:
  type: syslog

---
# 3. Receptor Syslog UDP do OpenWrt (Host NanoPi R3S @ 10.10.10.1)
# Recebe logs do Dropbear (SSH), LuCI e Firewall em tempo real via RAM
source: syslog
listen_addr: 0.0.0.0
listen_port: 514
labels:
  type: syslog


