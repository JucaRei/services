# ==============================================================================
# Gateway Reverso + WAF: Caddy + CrowdSec (Otimizado para NanoPi R3S / eMMC)
# Homelab Services: LXC harden @ 10.10.10.27
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Caddy: Reverse Proxy + Gerenciamento TLS/SSL + CrowdSec Bouncer (WAF)
  # ----------------------------------------------------------------------------
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    image: caddy:custom-crowdsec
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80/tcp"        # HTTP (Redirecionamento / ACME HTTP-01)
      - "443:443/tcp"      # HTTPS (TLS / SSL)
      - "443:443/udp"      # HTTP/3 (QUIC)
    environment:
      - CROWDSEC_API_KEY=${CROWDSEC_API_KEY}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/data
      - ./config:/config
      # Logs em RAM (tmpfs) para preservar vida útil do eMMC e não ocupar disco:
      - caddy-logs:/var/log/caddy
    logging:
      driver: "json-file"
      options:
        max-size: "3m"
        max-file: "2"
    mem_limit: 128M
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - crowdsec

  # ----------------------------------------------------------------------------
  # CrowdSec: Security Engine & Detecção de Intrusão
  # ----------------------------------------------------------------------------
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      - COLLECTIONS=crowdsecurity/caddy crowdsecurity/linux crowdsecurity/whitelist-good-actors crowdsecurity/http-cve
      - LEVEL=INFO
    volumes:
      - ./crowdsec/config:/etc/crowdsec
      - ./crowdsec/data:/var/lib/crowdsec/data
      - ./acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      # Lê os logs direto da RAM (tmpfs) com latência zero:
      - caddy-logs:/var/log/caddy:ro
      - /var/log/messages:/var/log/messages:ro
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "3m"
        max-file: "2"
    mem_limit: 128M
    deploy:
      resources:
        limits:
          memory: 128M

# ------------------------------------------------------------------------------
# VOLUMES: Logs montados estritamente em RAM (tmpfs) - Zero desgaste no eMMC
# ------------------------------------------------------------------------------
volumes:
  caddy-logs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=16m,mode=1777"
