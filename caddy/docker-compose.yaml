# ==============================================================================
# Gateway Reverso + WAF: Caddy + CrowdSec
# Homelab Services: LXC harden @ 10.10.10.27
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Caddy: Reverse Proxy + Gerenciamento TLS/SSL + CrowdSec Bouncer (WAF)
  # ----------------------------------------------------------------------------
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    image: caddy:custom-crowdsec
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80/tcp"        # HTTP (Redirecionamento / ACME HTTP-01)
      - "443:443/tcp"      # HTTPS (TLS / SSL)
      - "443:443/udp"      # HTTP/3 (QUIC)
    environment:
      - CROWDSEC_API_KEY=${CROWDSEC_API_KEY}
    volumes:
      # Arquivo de configuração em modo leitura:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Armazenamento de certificados TLS:
      - ./data:/data
      # Arquivos de estado e configuração interna do Caddy:
      - ./config:/config
      # Diretório de logs de acesso consumido pelo CrowdSec:
      - ./logs:/var/log/caddy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 128M
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - crowdsec

  # ----------------------------------------------------------------------------
  # CrowdSec: Security Engine & Detecção de Intrusão
  # ----------------------------------------------------------------------------
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      # Coleções oficiais para Caddy, Linux e proteção HTTP:
      - COLLECTIONS=crowdsecurity/caddy crowdsecurity/linux crowdsecurity/whitelist-good-actors crowdsecurity/http-cve
      - LEVEL=INFO
    volumes:
      # Configurações baixadas e parsers do CrowdSec:
      - ./crowdsec/config:/etc/crowdsec
      # Banco de dados SQLite local de decisões e reputação:
      - ./crowdsec/data:/var/lib/crowdsec/data
      # Arquivo de mapeamento de aquisição de logs:
      - ./acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      # Logs do Caddy (somente leitura):
      - ./logs:/var/log/caddy:ro
      # Logs do sistema do host (Alpine / LXC harden):
      - /var/log/messages:/var/log/messages:ro
    ports:
      # API local do CrowdSec (LAPI) restrita ao localhost do host:
      - "127.0.0.1:8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 128M
    deploy:
      resources:
        limits:
          memory: 128M
